<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block;margin:8px auto;max-width:100%}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';
const doc = await pdfjs.getDocument('uploads/Data%20Produc.pdf').promise;
window.showPage = async (n, scale = 0.75) => {
  const page = await doc.getPage(n);
  const vp = page.getViewport({ scale });
  const c = document.getElementById('c');
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return n;
};
window.__swap = () => {
  const c = document.getElementById('c');
  let im = document.getElementById('im');
  if (!im) { im = document.createElement('img'); im.id = 'im'; im.style.maxWidth = '100%'; im.style.display = 'block'; im.style.margin = '8px auto'; document.body.appendChild(im); c.style.display = 'none'; }
  im.src = c.toDataURL();
};
console.log('PDF pages:', doc.numPages);
await window.showPage(1); window.__swap();
</script></body></html>
